<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northstar Tabletop</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #6a7383; --line: #e2e5ea;
    --accent: #1f6feb; --accent-ink: #ffffff; --you: #e8f0fe; --term-bg: #0f1720; --term-ink: #d6e2ee;
    --flag: #b45309; --flag-bg: #fff4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151b; --panel: #181d25; --ink: #e4e8ee; --muted: #8b95a5; --line: #2a313c;
      --accent: #4c8dff; --accent-ink: #0b0f14; --you: #1e2a3d; --term-bg: #0a0e13; --term-ink: #cfe0f0;
      --flag: #f5b14c; --flag-bg: #3a2a10;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; display: grid; grid-template-columns: 270px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 16px; border-bottom: 1px solid var(--line); }
  aside h1 { font-size: 16px; margin: 0 0 2px; }
  aside .sub { color: var(--muted); font-size: 12px; }
  nav { flex: 1; overflow-y: auto; padding: 8px; }
  nav h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 8px 4px; }
  nav button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  nav button:hover { background: var(--bg); }
  nav button.active { background: var(--you); font-weight: 600; }
  nav .name { flex: 1; font-size: 14px; }
  nav .badge { font-size: 11px; color: var(--muted); }
  nav .badge.flag { color: var(--flag); font-weight: 600; }
  .controls { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; font-size: 13px; }
  .controls label { color: var(--muted); }
  select, .btn { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .btn { cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  details { font-size: 13px; }
  details ul { margin: 6px 0 0; padding-left: 18px; }
  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top h2 { font-size: 16px; margin: 0; flex: 1; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 760px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--you); }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .msg.system-agent { background: var(--term-bg); color: var(--term-ink); border: 0; font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; max-width: 100%; }
  .msg pre { margin: 6px 0; padding: 10px; background: var(--term-bg); color: var(--term-ink); border-radius: 6px; overflow-x: auto; font: 13px/1.45 Consolas, "Cascadia Mono", monospace; white-space: pre; }
  .msg.system-agent pre { padding: 0; margin: 0; }
  .flagmark { background: var(--flag-bg); color: var(--flag); font-weight: 600; padding: 0 4px; border-radius: 4px; }
  .empty, .error { color: var(--muted); text-align: center; margin-top: 15vh; }
  .error { color: #d1242f; }
  form { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 44px; max-height: 200px; }
  textarea.mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 14px; }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Northstar Seafood</h1>
    <div class="sub">Tabletop agents · local Ollama</div>
  </header>
  <nav id="nav"></nav>
  <div class="controls">
    <label for="model">Model</label>
    <select id="model"></select>
    <details id="flagbox"><summary>Flags found: <span id="flagcount">0</span></summary><ul id="flaglist"></ul></details>
    <button class="btn" id="newrun" type="button" title="Clear every agent's chat and all flags">New run (reset all)</button>
  </div>
</aside>
<main>
  <div class="top">
    <h2 id="title">Loading…</h2>
    <button class="btn" id="reset" type="button">Reset this agent</button>
  </div>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button class="btn primary" id="send" type="submit">Send</button>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let agents = [], current = null, controller = null;
let chats = store.get("ns.chats", {});   // agentId -> [{role, content}]
let flags = store.get("ns.flags", []);   // [{code, agent, time}]

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const markFlags = html => html.replace(/NS\{[^}\s]+\}/g, m => `<span class="flagmark">${m}</span>`);

function render(text) {
  // Minimal markdown: code fences, **bold**, _italic_ / *italic*, flag highlighting.
  const parts = text.split(/```[a-zA-Z]*\n?/);
  return parts.map((p, i) => {
    if (i % 2) return `<pre>${markFlags(esc(p.replace(/\n$/, "")))}</pre>`;
    let h = esc(p)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|\s)[_*]([^_*\n]+?)[_*](?=\s|$|[.,!?])/g, "$1<em>$2</em>");
    return markFlags(h);
  }).join("");
}

function saveAll() { store.set("ns.chats", chats); store.set("ns.flags", flags); }

function recordFlags(agentId, text) {
  for (const code of text.match(/NS\{[^}\s]+\}/g) || []) {
    if (!flags.some(f => f.code === code)) {
      flags.push({ code, agent: agentId, time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) });
    }
  }
}

function drawNav() {
  const groups = { persona: "Personas", system: "Systems" };
  $("nav").innerHTML = "";
  for (const [kind, label] of Object.entries(groups)) {
    const h = document.createElement("h2"); h.textContent = label; $("nav").append(h);
    for (const a of agents.filter(a => a.kind === kind)) {
      const b = document.createElement("button");
      b.className = a.id === current?.id ? "active" : "";
      const n = flags.filter(f => f.agent === a.id).length;
      const turns = (chats[a.id] || []).filter(m => m.role === "user").length;
      b.innerHTML = `<span class="name"></span><span class="badge ${n ? "flag" : ""}">${n ? "⚑ " + n : turns ? turns + " msg" : ""}</span>`;
      b.querySelector(".name").textContent = shortName(a.title);
      b.onclick = () => select(a.id);
      $("nav").append(b);
    }
  }
  $("flagcount").textContent = flags.length;
  $("flaglist").innerHTML = flags.map(f => `<li><span class="flagmark">${esc(f.code)}</span> ${esc(f.time)}</li>`).join("") || "<li>None yet</li>";
}

const shortName = t => t.replace(/^(Persona|System agent) \d+ – /, "");

function history(id) {
  if (!chats[id]) {
    const a = agents.find(a => a.id === id);
    chats[id] = a.greeting ? [{ role: "assistant", content: a.greeting }] : [];
  }
  return chats[id];
}

function drawLog() {
  const log = $("log"); log.innerHTML = "";
  const msgs = history(current.id);
  if (!msgs.length) {
    log.innerHTML = `<div class="empty">${current.kind === "system" ? "Type a command, e.g. <code>help</code>" : "Say hello to start the interview."}</div>`;
  }
  for (const m of msgs) log.append(bubble(m.role, m.content));
  log.scrollTop = log.scrollHeight;
}

function bubble(role, content) {
  const d = document.createElement("div");
  d.className = `msg ${role}` + (role === "assistant" && current.kind === "system" ? " system-agent" : "");
  d.innerHTML = render(content);
  return d;
}

function select(id) {
  if (controller) controller.abort();
  current = agents.find(a => a.id === id);
  store.set("ns.current", id);
  $("title").textContent = current.title;
  $("input").classList.toggle("mono", current.kind === "system");
  $("input").placeholder = current.kind === "system" ? "Command… (e.g. help)" : "Type a message… (Enter to send, Shift+Enter for a new line)";
  drawNav(); drawLog(); $("input").focus();
}

async function send(text) {
  const agentId = current.id, msgs = history(agentId);
  msgs.push({ role: "user", content: text });
  drawLog(); drawNav();
  const out = bubble("assistant", "…"); $("log").append(out);
  $("send").textContent = "Stop"; controller = new AbortController();
  let reply = "";
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
      body: JSON.stringify({ agent: agentId, model: $("model").value, messages: msgs }),
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      reply += dec.decode(value, { stream: true });
      out.innerHTML = render(reply);
      $("log").scrollTop = $("log").scrollHeight;
    }
  } catch (e) {
    if (e.name !== "AbortError") { reply = reply || ""; out.innerHTML = `<span class="error">⚠ ${esc(e.message)}</span>`; }
  } finally {
    controller = null; $("send").textContent = "Send";
  }
  if (reply.trim()) { msgs.push({ role: "assistant", content: reply }); recordFlags(agentId, reply); }
  else msgs.pop();  // failed turn: drop the question so it can be re-sent
  saveAll(); drawNav();
  if (current.id === agentId) drawLog();
}

$("form").onsubmit = e => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const text = $("input").value.trim();
  if (!text || !current || !$("model").value) return;
  $("input").value = ""; autosize(); send(text);
};
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
const autosize = () => { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; };
$("input").addEventListener("input", autosize);

$("reset").onclick = () => {
  if (!current || !confirm(`Reset the chat with ${shortName(current.title)}? Its flags will be cleared too.`)) return;
  if (controller) controller.abort();
  delete chats[current.id];
  flags = flags.filter(f => f.agent !== current.id);
  saveAll(); drawNav(); drawLog();
};
$("newrun").onclick = () => {
  if (!confirm("Start a new run? This clears all eight chats and every flag.")) return;
  if (controller) controller.abort();
  chats = {}; flags = []; saveAll(); drawNav(); if (current) drawLog();
};
$("model").onchange = () => store.set("ns.model", $("model").value);

(async () => {
  try {
    agents = await (await fetch("/api/agents")).json();
    const m = await (await fetch("/api/models")).json();
    if (m.error) throw new Error(m.error);
    if (!m.models.length) throw new Error("No Ollama models installed. Run: ollama pull llama3.1:8b");
    const saved = store.get("ns.model", null);
    $("model").innerHTML = m.models.map(n => `<option>${esc(n)}</option>`).join("");
    $("model").value = m.models.includes(saved) ? saved : m.default;
    const last = store.get("ns.current", null);
    select(agents.some(a => a.id === last) ? last : agents[0].id);
  } catch (e) {
    $("title").textContent = "Not ready";
    $("log").innerHTML = `<div class="error">⚠ ${esc(e.message)}</div>`;
    if (agents.length) { current = agents[0]; drawNav(); }
  }
})();
</script>
</body>
</html>
